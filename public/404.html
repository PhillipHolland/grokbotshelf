<script>
// /@handle with no creator page (creator pages are static; a mixed-case /@Handle was sent to the lowercase URL in the head):
// say which creator is missing, and offer a search for the handle and the creator list
(function () {
  var m = location.pathname.match(/^\/(?:@|%40)([a-z0-9_]+)\/?$/), a = document.getElementById("nf-search");
  if (!m || !a) return;
  var h = "@" + m[1], acts = a.parentNode, get = acts.querySelector(".get");
  document.title = "Creator not found · Grok Bot Shelf";
  document.getElementById("nf-h").textContent = "Creator not found";
  document.getElementById("nf-desc").textContent = "No bots by " + h + " are on the shelf yet. Check the spelling, or browse every creator.";
  // the search is the main button: on phones that is the blue .app button, shown first
  var mob = document.documentElement.classList.contains("mobile"), pri = mob ? a : get, sec = mob ? get : a;
  pri.textContent = "Search for " + h; pri.href = "/?q=" + encodeURIComponent(m[1]);
  sec.textContent = "Browse creators"; sec.href = "/?sort=creator"; a.hidden = false;
})();
// /bot/<slug> that is not on the shelf: offer a search for the words in the slug
(function () {
  var m = location.pathname.match(/^\/bot\/([a-z0-9-]+)\/?$/i), a = document.getElementById("nf-search");
  if (!m || !a) return;
  a.href = "/?q=" + encodeURIComponent(m[1].replace(/-/g, " "));
  a.hidden = false;
})();
</script>
